# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: MCP Switcher test and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tests_only:
        description: Run tests without building or publishing an image
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
concurrency:
  group: mcp-switcher-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: switcher
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=12
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-password
          MARIADB_DATABASE: switcher
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: python -m pip install '.[test]'
      - name: Check dependency compatibility and source
        run: |
          python -m pip check
          ruff check src tests .github/scripts
          bash -n config.sh optional_persistence.sh
          node --check src/mcp_switcher/static/app.js
      - name: Test all database backends, authentication and MCP
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:test-password@localhost:5432/switcher
          TEST_MARIADB_URL: mysql+pymysql://root:test-password@127.0.0.1:3306/switcher
        run: |
          python -m pytest -q --junitxml=pytest-results.xml
          node --test tests/*.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: pytest-results.xml
  litellm-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: litellm
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - name: Start the supported LiteLLM on the runner
        run: |
          docker run -d --name litellm-contract --network host \
            -e DATABASE_URL=postgresql://postgres:test-password@127.0.0.1:5432/litellm \
            -e LITELLM_MASTER_KEY=ci-master-00000000000000000000000000000000 \
            ghcr.io/berriai/litellm-database:v1.106.2 --host 127.0.0.1 --port 4000
      - name: Verify real MCP permission semantics
        env:
          CONTRACT_MASTER_KEY: ci-master-00000000000000000000000000000000
        run: python .github/scripts/litellm_contract.py
      - name: Show LiteLLM diagnostics on failure
        if: failure()
        run: docker logs --tail 100 litellm-contract
      - name: Stop contract service
        if: always()
        run: docker rm -f litellm-contract || true
  build-test-publish:
    if: ${{ !inputs.tests_only }}
    needs: [test, litellm-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IMAGE_NAME: ghcr.io/f24sales/litellm-mcp-switcher-safrano9999
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Resolve package version
        id: release
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [[ "$version" =~ ^[0-9]{4}\.[0-9]{1,2}\.[1-9][0-9]*$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate on the GitHub runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          tags: mcp-switcher-candidate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/f24sales/litellm-mcp-switcher
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            io.safrano9999.build.commit=${{ github.sha }}
      - name: Test Alpine listeners, switches, restart and persistence
        shell: bash
        run: |
          set -euo pipefail
          volume="mcp-switcher-smoke-${GITHUB_RUN_ID}"
          docker volume create "$volume" >/dev/null
          container=""
          trap 'if [ -n "$container" ]; then docker rm -f "$container" >/dev/null; fi; docker volume rm "$volume" >/dev/null' EXIT
          for mode in both web mcp; do
            web=1; mcp=1
            if [ "$mode" = web ]; then mcp=0; fi
            if [ "$mode" = mcp ]; then web=0; fi
            container=$(docker run --pull=never -d --network none --read-only --tmpfs /tmp \
              -v "$volume:/opt/f24sales/litellm-mcp-switcher/sqlite" \
              -v "$GITHUB_WORKSPACE/.github/scripts:/ci-tests:ro" \
              -e LITELLM_MCP_SWITCHER_ADMIN_VIRTUAL_KEY=ci-admin-00000000000000000000000000000000 \
              -e LITELLM_MCP_SWITCHER_BEARER_ALIAS=ci-user \
              -e LITELLM_MCP_SWITCHER_KEY_ALLOWED_MCPS=fixture \
              -e LITELLM_MCP_SWITCHER_KEY_SWITCHER_BEARER=ci-switcher-00000000000000000000000000000000 \
              -e LITELLM_MCP_SWITCHER_KEY_BEARER=ci-litellm-00000000000000000000000000000000 \
              -e LITELLM_MCP_SWITCHER_API_BASE_URL=http://127.0.0.1:4000 \
              -e LITELLM_MCP_SWITCHER_ORCHESTRATOR_NAME=ci-orchestrator \
              -e LITELLM_MCP_SWITCHER_ORCHESTRATOR_BEARER=ci-orchestrator-00000000000000000000000000 \
              -e LITELLM_MCP_SWITCHER_ORCHESTRATOR_BEARER_ALIASES=ci-user \
              -e LITELLM_MCP_SWITCHER_WEBUI_ENABLED="$web" -e LITELLM_MCP_SWITCHER_MCP_ENABLED="$mcp" \
              --entrypoint python3 "mcp-switcher-candidate:${GITHUB_SHA}" /ci-tests/run_fixture.py)
            docker exec "$container" python3 /ci-tests/smoke.py
            docker restart "$container" >/dev/null
            docker exec "$container" python3 /ci-tests/smoke.py restart
            docker stop --time 20 "$container" >/dev/null
            [ "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0 ]
            docker rm "$container" >/dev/null; container=""
          done
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Protect immutable release versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: python3 .github/scripts/check_release.py
      - name: Publish the tested candidate
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          docker tag "mcp-switcher-candidate:${GITHUB_SHA}" "$IMAGE_NAME:$RELEASE_VERSION"
          docker tag "mcp-switcher-candidate:${GITHUB_SHA}" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$RELEASE_VERSION"
          docker push "$IMAGE_NAME:latest"
