[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "litellm-mcp-switcher"
version = "2026.10.3"
description = "Project-based MCP access selection for existing LiteLLM virtual keys"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.159.1", "uvicorn==0.54.0", "fastmcp==4.1.3",
  "pydantic-settings==2.16.1", "httpx==0.28.1", "SQLAlchemy==2.1.6",
  "alembic==1.20.0", "psycopg==3.3.6", "PyMySQL==1.2.3", "Jinja2==3.1.6",
]
[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "respx==0.23.1", "ruff==0.17.1"]
[project.scripts]
litellm-mcp-switcher = "mcp_switcher.__main__:main"
[tool.setuptools.package-data]
mcp_switcher = ["templates/*.html", "static/*", "migrations/*.py", "migrations/versions/*.py"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
